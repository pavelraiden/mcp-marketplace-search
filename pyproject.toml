[project]
name = "mcp-marketplace-search"
version = "1.0.0"
description = "MCP server for searching multiple marketplace platforms (Vinted, eBay, Grailed, Vestiaire, Depop)"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Install playwright for automatic Vinted cookie management
vinted = ["playwright>=1.40.0"]
# Development & testing
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]
# Install all optional deps
all = ["playwright>=1.40.0", "pytest>=8.0.0", "pytest-cov>=5.0.0"]

[project.scripts]
marketplace-search = "server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["server"]
omit = ["tests/*"]
